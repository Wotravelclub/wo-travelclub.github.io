<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Mavicure | WO Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
--wo-blue:#021e98;
--wo-yellow:#f2ea99;
--wo-purple:#a012ff;
--wo-cream:#ebebd7;
}
body{font-family:Montserrat,sans-serif;background:var(--wo-cream);margin:0;padding:20px;color:var(--wo-blue)}
.container{max-width:700px;margin:auto}
.badge{display:inline-block;background:var(--wo-yellow);padding:10px 18px;border-radius:999px;font-weight:700}
.center{text-align:center}
.title{font-family:"Amatic SC",cursive;font-size:64px;margin:15px 0 0}
.subtitle{color:var(--wo-purple);font-size:24px;margin-bottom:20px}
.progress{height:14px;background:#fff;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:var(--wo-yellow);transition:.3s}
.card{background:#fff;border-radius:24px;padding:20px;margin-top:20px}
.item{display:flex;gap:12px;background:#f8f8ef;padding:14px;border-radius:16px;margin-bottom:10px}
input[type=checkbox]{accent-color:var(--wo-purple);width:24px;height:24px}
.small{font-size:13px;color:var(--wo-purple)}
.popup{display:none;position:fixed;inset:0;background:rgba(2,30,152,.8);align-items:center;justify-content:center;padding:20px}
.popupbox{background:#021e98;color:#fff;border-radius:24px;padding:30px;max-width:420px;text-align:center}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;background:linear-gradient(90deg,#ff8bb4,#a012ff);color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="container">
<div class="center">
<div class="badge">✈️ Aventura de Mujeres</div>
<div class="title">CHECKLIST MAVICURE ✨</div>
<div class="subtitle">Keep Expanding 🦋</div>
</div>

<div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px">
<span>Tu progreso</span><span><span id="count">0</span> de 11 ✓</span>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div class="card" id="list"></div>
</div>

<div class="popup" id="popup">
<div class="popupbox">
<div style="font-size:60px">🎉</div>
<h2>¡LISTA PARA LA AVENTURA!</h2>
<p>Tienes todo lo necesario para vivir la experiencia Mavicure ✨</p>
<p>Keep Expanding 🦋</p>
<a href="#" class="btn">Comenzar la aventura 🚀</a>
</div>
</div>

<script>
const items=[
["Repelente contra insectos 🦟","Súper importante"],
["Protector solar ☀️","Protege tu piel"],
["Toalla y artículos de aseo personal 🧴","Lo básico siempre"],
["Carnet de vacunación 💉","Fiebre amarilla - obligatorio"],
["Efectivo 💵","No hay cajeros allá"],
["Vestido de baño 👙","¡A disfrutar el agua!"],
["Linterna o luz frontal 🔦","Poca iluminación en la noche"],
["Ropa ligera y fresca 👕","Algodón o secado rápido"],
["Ropa para dormir 🌙","Descanso cómodo"],
["Pantalón largo 👖","Ideal para recorridos"],
["Tenis cerrados 👟","Dunas y terreno irregular"]
];
const list=document.getElementById('list');
items.forEach((i,n)=>{
list.innerHTML+=`<div class="item"><input type="checkbox" id="c${n}"><label for="c${n}"><strong>${i[0]}</strong><div class="small">${i[1]}</div></label></div>`;
});
const checks=document.querySelectorAll('input');
function update(){
let total=0;
checks.forEach((c,i)=>{
if(localStorage.getItem('mav'+i)==='1') c.checked=true;
if(c.checked) total++;
});
document.getElementById('count').textContent=total;
document.getElementById('bar').style.width=(total/checks.length*100)+'%';
if(total===checks.length) document.getElementById('popup').style.display='flex';
}
checks.forEach((c,i)=>{
c.addEventListener('change',()=>{
localStorage.setItem('mav'+i,c.checked?'1':'0');
update();
});
});
update();
</script>
</body>
</html>
